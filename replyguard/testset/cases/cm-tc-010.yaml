tags:
- email
- en
- sarcasm
- complaint
- tricky
rules:
- CM-010
- CM-031
- CM-003
input:
  now: '2026-11-10T10:12:00+04:00'
  channel: email
  campaign:
    options:
      arabic_auto_send: true
      whatsapp_cold_first_touch: true
    booking_link: null
  sender:
    name: Ali
    company: Paralax
    account: mbx-ali-1
  lead:
    state: contacted
    wave: 1
    is_company_contact: false
  thread:
  - dir: out
    at: '2026-11-10T10:05:00+04:00'
