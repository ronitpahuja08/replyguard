id: cm-tc-032
title: '''WhatsApp call now?'' in the UAE: no WhatsApp call; the link instead'
tags:
- whatsapp
- en
- meeting
- uae
rules:
- CM-027
input:
  now: '2026-11-10T10:12:00+04:00'
  channel: whatsapp
  campaign:
    options:
      arabic_auto_send: true
      whatsapp_cold_first_touch: true
    booking_link: https://cal.example/paralax-ali
  sender:
    name: Ali
    company: Paralax
    account: wa-ali
  lead:
    state: contacted
    wave: 1
    is_company_contact: false
  thread:
  - dir: out
    at: '2026-11-10T10:05:00+04:00'
    text: Hi Khalid, we measured how Al Noor Motors answers WhatsApp enquiries after hours, and the result surprised us. Shall I send you the
      one-pager? Ali, Paralax. Reply STOP to opt out.
    kind: jab_1
  reply:
    at: '2026-11-10T10:12:00+04:00'
    text: Can we jump on a WhatsApp call now?
expect:
  label: meeting_request
  detector_opt_out: false
  suppress: none
  lead_state_after: replied
  handover: false
  reply: booking_link
  whatsapp_call_placed: false
  must_not_include:
  - calling you now
  also: []
